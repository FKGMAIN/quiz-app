services:
  app:
    build: .
    container_name: pitch-legends-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      # Same file name the Express version used, so the existing volume's data is upgraded in place.
      - SQLITE_DB_PATH=/app/data/soccer_puzzle.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
